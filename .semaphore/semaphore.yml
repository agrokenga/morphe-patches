version: v1.0
name: CI/CD
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404

blocks:
  - name: Release
    run:
      when: "branch =~ '^(main|dev)$' and pull_request !~ '.+' and tag !~ '.+'"
    task:
      prologue:
        commands:
          - checkout
          - sem-version java 21
          - sem-version node 24
          - |
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --unshallow
            fi
          - git config remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
          - git fetch --all --tags
      secrets:
        - name: morphe-patches-ci
      jobs:
        - name: Semantic release and build verification
          commands:
            - install-package --update gh jq
            - npm ci
            - export GITHUB_REPOSITORY="$SEMAPHORE_GIT_REPO_SLUG"
            - export GITHUB_REF_NAME="$SEMAPHORE_GIT_BRANCH"
            - git remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
            - printf 'https://x-access-token:%s@github.com\n' "$GITHUB_TOKEN" > "$HOME/.git-credentials"
            - chmod 600 "$HOME/.git-credentials"
            - git config --global credential.helper "store --file=$HOME/.git-credentials"
            - npx semantic-release
            - |
              if ! compgen -G 'patches/build/libs/patches-*.mpp' > /dev/null; then
                ./gradlew :patches:buildAndroid clean --no-daemon
              fi

  - name: Verify build
    run:
      when: "pull_request =~ '.+' or tag =~ '.+' or branch !~ '^(main|dev)$'"
    task:
      prologue:
        commands:
          - checkout
          - sem-version java 21
      jobs:
        - name: Build patches
          commands:
            - ./gradlew :patches:buildAndroid clean --no-daemon

  - name: Open pull request to main
    run:
      when: "branch = 'dev' and pull_request !~ '.+' and tag !~ '.+'"
    task:
      prologue:
        commands:
          - checkout
      secrets:
        - name: morphe-patches-ci
      jobs:
        - name: Open pull request
          commands:
            - install-package --update gh jq
            - export GH_TOKEN="$GITHUB_TOKEN"
            - |
              if gh pr list --base main --head dev --json number | jq -e '. | length > 0' >/dev/null; then
                echo "Pull request already exists."
              else
                commits=$(gh api "repos/$SEMAPHORE_GIT_REPO_SLUG/compare/main...dev" --jq '.total_commits')
                if [ "$commits" -eq 0 ]; then
                  echo "No commits between main and dev. Skipping PR creation."
                else
                  gh pr create \
                    --base main \
                    --head dev \
                    --title 'chore: Merge branch `dev` to `main`' \
                    --body "When dev (pre-release) is ready, merge this pull request to create a new stable release."
                fi
              fi
